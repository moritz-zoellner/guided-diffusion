[workspace]
authors = ["Tassos Manganaris <tassos.manganaris@gmail.com>"]
channels = ["conda-forge", "main", "r", "msys2"]
name = "guided-diffusion"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[activation.env]
PYTHONNOUSERSITE = "1"

[dependencies]
python = ">=3.10,<3.11"
spot = ">=2.14.5,<3"
ipykernel = ">=7.2.0,<8"
ipywidgets = ">=8.1.8,<9"
setuptools = "<82"
pip = ">=26.0.1,<27"
wandb = ">=0.26.0,<0.27"

[pypi-dependencies]
h5py = ">=3.16.0, <4"
torch = ">=2.11.0, <3"
robomimic = { path = "/home/moritz/src/guided-diffusion/robomimic", editable = true }
scipy = ">=1.15.3, <2"
huggingface-hub = "==0.23.4"
diffusers = ">=0.11.1, <0.12"
corallab-stl = { path = "/home/tassos/phd/research/corallab-stl", editable = true }
jupytext = ">=1.19.1, <2"
gym = ">=0.26.2, <0.27"
pygame = ">=2.6.1, <3"
pymunk = ">=7.2.0, <8"
shapely = ">=2.1.2, <3"
scikit-image = ">=0.25.2, <0.26"
numpy = "<2"
opencv-python = ">=4.11.0.86, <5"
mlflow = ">=3.10, <3.11"
